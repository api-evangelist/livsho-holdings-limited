name: Livsho Holdings Limited
description: Livsho Holdings Limited operates LIVSHO, described as the GCC's first
  live auction marketplace for collectibles, where users buy, sell, and connect around
  the things they love through interactive live shopping experiences. The consumer-facing
  platform is delivered primarily through a mobile app, with a Wix-hosted marketing
  presence at livsho.tv and livsho.com and a Linktree for app downloads. Livsho is a
  portfolio company of 500 Global. No public API, developer portal, or machine-readable
  API documentation is currently published.
